# Pipeline A – Minimal PR validation
name: PR-Validate

trigger: none   # Ingen CI-trigger, bara PR

pr:
  autoCancel: true
  branches:
    include:
      - main
      - develop

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self
  fetchDepth: 0

- script: |
    set -e
    dotnet restore ReviewTest/ReviewTest.sln
    dotnet build ReviewTest/ReviewTest.sln --no-restore
    dotnet test ReviewTest/ReviewTest.sln --no-build
  displayName: "Build & test"